[project]
name = "mytest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyzmq>=25.0",
    # hardware/odrive/odrive_backend.py talks to real ODrive hardware over
    # USB (pulls in pyusb/libusb). Pinned to the 0.6.x line since that's the
    # firmware hardware/odrive targets (see odrive_channels.py).
    "odrive>=0.6.0,<0.7.0",
    # tools/manual_gui.py's live telemetry graph (dual y-axis, embedded in
    # Tkinter via FigureCanvasTkAgg).
    "matplotlib>=3.8",
    # hardware/tc_daq/ reads the thermocouple DAQ's serial stream. The device
    # sits behind a CP2102N USB-UART bridge and announces nothing of its own, so
    # pyserial's list_ports is also how an operator finds which port it is on.
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    # tests/ - pure-logic unit tests over the verdict record, the bound
    # summary, wide CSV storage and replay. No hardware, no ZeroMQ.
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path, since modules are imported as top-level packages
# (protocol/, hardware/, testcases/, telemetry_engine/) rather than installed.
pythonpath = ["."]
